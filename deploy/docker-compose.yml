services:
  web:
    image: ghcr.io/hrithik450/harness-web:latest
    container_name: harness-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: true
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=https://harness.mhrithik.com

